name: Code Analysis

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    code_analysis:
        strategy:
            fail-fast: false
            matrix:
                actions:
                    -
                        name: 'Run dummy CLI app'
                        run: php tests/Console/bin/some-app.php

                    -
                        name: 'PHPStan'
                        run: vendor/bin/phpstan

                    -
                        name: 'Composer Validate'
                        run: composer validate

                    -
                        name: 'Coding Standard'
                        run: vendor/bin/ecs

                    -
                        name: 'Tests'
                        run: vendor/bin/phpunit

                    -
                        name: 'Composer Dependency Analysis'
                        run: vendor/bin/composer-dependency-analyser

                    -
                        name: 'Final'
                        # Container is intentionally extendable (see its @api docblock), so it is not finalized
                        run: vendor/bin/swiss-knife finalize-classes src tests --dry-run --skip-file=src/Container/Container.php

        name: ${{ matrix.actions.name }}
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4
            # see https://github.com/shivammathur/setup-php
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            # composer install cache - https://github.com/ramsey/composer-install
            -   uses: "ramsey/composer-install@v2"

            -   run: ${{ matrix.actions.run }}
