name: Tests

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    tests:
        strategy:
            fail-fast: false
            matrix:
                php-version: ['7.4', '8.2', '8.5']

        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: none

            # analysis tools require PHP 8.2+ and are irrelevant to the test run;
            # drop them so the low-PHP jobs install a clean, 7.4-compatible dependency set
            -   run: composer remove --dev --no-update tracy/tracy symplify/easy-coding-standard phpstan/phpstan symplify/phpstan-rules phpstan/extension-installer tomasvotruba/type-coverage shipmonk/composer-dependency-analyser rector/rector rector/swiss-knife tomasvotruba/unused-public rector/jack

            -   run: composer update --no-progress --prefer-stable

            -   name: PHP Linter
                # Enum fixture is intentionally PHP 8.1 syntax, used to test enum discovery
                run: vendor/bin/parallel-lint src tests --exclude tests/Container/Autodiscovery/Fixture/project-with-value-objects/src/Enum

            -   name: Tests
                run: vendor/bin/phpunit

            -   name: Smoke run CLI app
                run: php tests/Console/bin/some-app.php
