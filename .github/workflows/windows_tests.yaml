name: Windows Tests

on:
    pull_request: null
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    tests:
        name: PHPUnit on Windows

        runs-on: windows-latest

        steps:
            -   uses: actions/checkout@v4

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none

            -   uses: ramsey/composer-install@v2

            -   name: Run terminal regression tests
                run: php vendor/bin/phpunit tests/Console/Terminal/TerminalTest.php

            -   name: Run PHPUnit suite
                run: php vendor/bin/phpunit
